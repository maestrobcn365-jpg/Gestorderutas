<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gestor de Albaranes</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
body { font-family: Arial, sans-serif; background: #f4f4f9; margin: 0; padding: 15px; display: flex; flex-direction: column; align-items: center; }
.tabs { display: flex; width: 100%; max-width: 500px; margin-bottom: 15px; gap: 8px; }
.tab-btn { flex: 1; padding: 12px; border: none; border-radius: 8px; background: #ddd; color: #333; font-weight: bold; font-size: 14px; cursor: pointer; }
.tab-btn.activa { background: #007BFF; color: white; }
.seccion-tab { width: 100%; max-width: 500px; display: none; }
.seccion-tab.activa { display: block; }
.container { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 100%; box-sizing: border-box; margin-bottom: 20px; }
h2, h3 { text-align: center; color: #333; margin-top: 0; }
input[type="file"] { display: none; }
.grupo-botones-carga { display: flex; gap: 10px; margin-bottom: 15px; }
.btn-carga { flex: 1; color: white; padding: 12px 10px; border-radius: 8px; font-size: 14px; cursor: pointer; text-align: center; font-weight: bold; display: block; }
.btn-camara { background: #007BFF; }
.btn-galeria { background: #6610f2; }
#estado { text-align: center; margin: 10px 0; font-weight: bold; color: #555; font-size: 14px; }
.form-group { margin-bottom: 12px; }
label { display: block; font-size: 13px; font-weight: bold; margin-bottom: 4px; }
input[type="text"], textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 14px; font-family: Arial, sans-serif; }
.campo-azul { border-left: 5px solid #007BFF; }
.campo-amarillo { border-left: 5px solid #f1c40f; }
.campo-rojo { border-left: 5px solid #e74c3c; }
.campo-lila { border-left: 5px solid #9b59b6; }
.btn-accion { padding: 14px; border: none; border-radius: 8px; font-size: 15px; cursor: pointer; width: 100%; font-weight: bold; margin-top: 10px; box-sizing: border-box; display: block; }
.btn-guardar { background: #28a745; color: white; }
.btn-guardar:active { background: #1e7e34; transform: scale(0.99); }
.btn-limpiar { background: #6c757d; color: white; }
.panel-mapa { background: white; padding: 12px; border-radius: 10px; box-shadow: 0 2px 6px rgba(0,0,0,0.1); margin-bottom: 15px; }
#mapaMarcadores { width: 100%; height: 350px; border-radius: 8px; border: 2px solid #007BFF; margin-top: 8px; z-index: 1; }
#estadoMapa { font-size: 12px; color: #555; text-align: center; margin-top: 6px; font-weight: bold; }
.pin-numero { background: #e74c3c; color: white; border-radius: 50%; border: 2px solid white; font-weight: bold; text-align: center; line-height: 24px; font-size: 13px; box-shadow: 0 2px 5px rgba(0,0,0,0.4); }
.pin-usuario { background: #007BFF; color: white; border-radius: 50%; border: 3px solid white; font-weight: bold; text-align: center; line-height: 24px; font-size: 10px; box-shadow: 0 0 0 6px rgba(0, 123, 255, 0.35), 0 2px 5px rgba(0,0,0,0.5); }
.panel-ruta { background: #fff3cd; border: 2px solid #fd7e14; padding: 15px; border-radius: 10px; margin-bottom: 15px; text-align: center; }
.btn-ruta-completa { background: #fd7e14; color: white; padding: 12px; border-radius: 8px; font-size: 14px; font-weight: bold; text-decoration: none; display: block; width: 100%; box-sizing: border-box; margin-top: 8px; }
.cliente-card { background: white; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 15px; border-left: 6px solid #007BFF; }
.cliente-card h4 { margin: 0 0 8px 0; color: #007BFF; }
.cliente-card p { margin: 4px 0; font-size: 13px; color: #555; white-space: pre-wrap; }
.card-acciones { display: flex; gap: 8px; margin-top: 10px; }
.btn-card { flex: 1; padding: 8px; border: none; border-radius: 5px; font-size: 12px; font-weight: bold; cursor: pointer; text-align: center; text-decoration: none; }
.btn-mapa { background: #17a2b8; color: white; }
.btn-editar { background: #ffc107; color: #333; }
.btn-borrar { background: #dc3545; color: white; }
</style>
</head>
<body>

<div class="tabs">
    <button type="button" id="tabBtn1" class="tab-btn activa">➕ Escanear Albarán</button>
    <button type="button" id="tabBtn2" class="tab-btn">📍 Mapa y Repartos (<span id="contadorParadas">0</span>)</button>
</div>

<!-- PESTAÑA 1: ESCANEAR Y GUARDAR -->
<div id="pestana1" class="seccion-tab activa">
    <div class="container">
        <h2>Gestor de Albaranes</h2>
        
        <div class="grupo-botones-carga">
            <label for="camaraInput" class="btn-carga btn-camara">📸 Hacer Foto</label>
            <label for="galeriaInput" class="btn-carga btn-galeria">📁 Abrir Galería</label>
        </div>

        <input type="file" id="camaraInput" accept="image/*" capture="environment">
        <input type="file" id="galeriaInput" accept="image/*">

        <div id="estado">Listo para escanear o seleccionar...</div>

        <input type="hidden" id="edit-id" value="">

        <div class="form-group">
            <label style="color: #007BFF;">Nombre y Apellidos:</label>
            <input type="text" id="nombre" class="campo-azul">
        </div>

        <div class="form-group">
            <label style="color: #d4ac0d;">Dirección de Entrega (Calle y Nº):</label>
            <input type="text" id="direccion" class="campo-amarillo">
        </div>

        <div class="form-group">
            <label style="color: #e74c3c;">Código Postal (4 o 5 dígitos):</label>
            <input type="text" id="poblacion" class="campo-rojo" placeholder="Ej: 08901 o 8901">
        </div>

        <div class="form-group">
            <label style="color: #9b59b6;">Teléfono:</label>
            <input type="text" id="telefono" class="campo-lila">
        </div>

        <div class="form-group">
            <label style="color: #555;">Texto Extraído Completo:</label>
            <textarea id="textoExtraido" rows="3"></textarea>
        </div>

        <button type="button" id="btnGuardar" class="btn-accion btn-guardar">💾 Guardar en Hoja de Ruta</button>
        <button type="button" id="btnLimpiar" class="btn-accion btn-limpiar">🔄 Nuevo / Limpiar</button>
    </div>
</div>

<!-- PESTAÑA 2: MAPA CON TU POSICIÓN Y MARCADORES -->
<div id="pestana2" class="seccion-tab">
    <div class="panel-mapa">
        <div style="display:flex; justify-content:space-between; align-items:center; gap:5px;">
            <b style="color:#007BFF; font-size:13px;">🔵 TÚ = Tu GPS | 🔴 1,2,3 = Repartos</b>
            <button type="button" id="btnRefrescarGPS" style="background:#28a745; color:white; border:none; padding:6px 10px; border-radius:5px; font-size:11px; font-weight:bold; cursor:pointer;">📡 Mi GPS</button>
        </div>
        <div id="mapaMarcadores"></div>
        <div id="estadoMapa">Obteniendo señal GPS y ubicando paradas...</div>
    </div>

    <div id="cajaRutaCompleta" class="panel-ruta" style="display:none;">
        <b style="color:#d9534f; font-size:14px;">🗺️ Ruta por tramos en Google Maps:</b>
        <div id="botonesTramos"></div>
    </div>

    <div id="contenedor-clientes"></div>
</div>

<script>
let clientes = [];
let mapa = null;
let capaMarcadores = null;
let marcadorUsuario = null;
let circuloPrecision = null;
let coordsUsuario = null;
let watchId = null;

const camaraInput = document.getElementById('camaraInput');
const galeriaInput = document.getElementById('galeriaInput');
const estado = document.getElementById('estado');
const inputEditId = document.getElementById('edit-id');
const inputNombre = document.getElementById('nombre');
const inputDireccion = document.getElementById('direccion');
const inputPoblacion = document.getElementById('poblacion');
const inputTelefono = document.getElementById('telefono');
const inputTexto = document.getElementById('textoExtraido');
const contenedorClientes = document.getElementById('contenedor-clientes');
const cajaRutaCompleta = document.getElementById('cajaRutaCompleta');
const botonesTramos = document.getElementById('botonesTramos');
const contadorParadas = document.getElementById('contadorParadas');
const estadoMapa = document.getElementById('estadoMapa');

// Conexión directa de todos los botones para evitar bloqueos en GitHub
document.getElementById('tabBtn1').addEventListener('click', () => cambiarPestana(1));
document.getElementById('tabBtn2').addEventListener('click', () => cambiarPestana(2));
document.getElementById('btnGuardar').addEventListener('click', guardarCliente);
document.getElementById('btnLimpiar').addEventListener('click', limpiarFormulario);
document.getElementById('btnRefrescarGPS').addEventListener('click', () => solicitarGPSReal(true));

camaraInput.addEventListener('change', manejarArchivo);
galeriaInput.addEventListener('change', manejarArchivo);

// Almacenamiento blindado compatible con GitHub Pages y navegadores restringidos
function guardarEnAlmacenamiento() {
    let textoJSON = JSON.stringify(clientes);
    try { localStorage.setItem("repartos_github_v1", textoJSON); } catch(e) {}
    try { sessionStorage.setItem("repartos_github_v1", textoJSON); } catch(e) {}
    try { window.name = textoJSON; } catch(e) {}
}

function cargarDesdeAlmacenamiento() {
    try {
        let d = localStorage.getItem("repartos_github_v1") || sessionStorage.getItem("repartos_github_v1") || window.name;
        if (d && d.startsWith("[")) {
            clientes = JSON.parse(d);
        }
    } catch(e) {}
}

function inicializarMapa() {
    if (mapa) return;
    if (typeof L === 'undefined') {
        estadoMapa.innerText = "Error al cargar librería del mapa. Comprueba tu conexión.";
        return;
    }
    mapa = L.map('mapaMarcadores').setView([41.3874, 2.1686], 11);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap'
    }).addTo(mapa);
    capaMarcadores = L.layerGroup().addTo(mapa);

    mapa.locate({ setView: false, watch: true, enableHighAccuracy: true, maximumAge: 0 });
    mapa.on('locationfound', function(e) {
        actualizarPinGPS(e.latlng.lat, e.latlng.lng, e.accuracy);
    });
}

function actualizarPinGPS(lat, lon, precision) {
    let eraNulo = !coordsUsuario;
    coordsUsuario = [lat, lon];
    if (!mapa || typeof L === 'undefined') return;

    let iconoAzul = L.divIcon({
        className: 'pin-usuario',
        html: 'TÚ',
        iconSize: [30, 30],
        iconAnchor: [15, 15]
    });

    if (marcadorUsuario) {
        marcadorUsuario.setLatLng(coordsUsuario);
    } else {
        marcadorUsuario = L.marker(coordsUsuario, { icon: iconoAzul, zIndexOffset: 2000 })
            .bindPopup("<b>🔵 Tu Posición Actual (GPS)</b>")
            .addTo(mapa);
    }

    if (precision && precision < 1500) {
        if (circuloPrecision) {
            circuloPrecision.setLatLng(coordsUsuario).setRadius(precision);
        } else {
            circuloPrecision = L.circle(coordsUsuario, {
                radius: precision,
                color: '#007BFF',
                fillColor: '#007BFF',
                fillOpacity: 0.15,
                weight: 1
            }).addTo(mapa);
        }
    }

    if (eraNulo) ajustarVistaMapa();
}

function solicitarGPSReal(centrar) {
    if (!navigator.geolocation) return;

    navigator.geolocation.getCurrentPosition(
        function(pos) {
            actualizarPinGPS(pos.coords.latitude, pos.coords.longitude, pos.coords.accuracy);
            if (centrar && mapa) mapa.setView([pos.coords.latitude, pos.coords.longitude], 15);
            else ajustarVistaMapa();
        },
        function() {},
        { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
    );

    if (!watchId) {
        watchId = navigator.geolocation.watchPosition(
            function(pos) {
                actualizarPinGPS(pos.coords.latitude, pos.coords.longitude, pos.coords.accuracy);
            },
            function() {},
            { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
        );
    }
}

function ajustarVistaMapa() {
    if (!mapa) return;
    let puntos = [];
    if (coordsUsuario) puntos.push(coordsUsuario);
    clientes.forEach(c => {
        if (c.lat && c.lon) puntos.push([c.lat, c.lon]);
    });
    if (puntos.length > 0) {
        mapa.fitBounds(puntos, { padding: [40, 40], maxZoom: 15 });
    }
}

function cambiarPestana(num) {
    document.getElementById('pestana1').className = num === 1 ? 'seccion-tab activa' : 'seccion-tab';
    document.getElementById('pestana2').className = num === 2 ? 'seccion-tab activa' : 'seccion-tab';
    document.getElementById('tabBtn1').className = num === 1 ? 'tab-btn activa' : 'tab-btn';
    document.getElementById('tabBtn2').className = num === 2 ? 'tab-btn activa' : 'tab-btn';
    if (num === 2) {
        inicializarMapa();
        solicitarGPSReal(false);
        setTimeout(() => {
            if (mapa) mapa.invalidateSize();
            colocarMarcadoresEnMapa();
        }, 200);
    }
}

async function manejarArchivo(e) {
    const archivo = e.target.files[0];
    if (!archivo) return;

    estado.innerText = "Subiendo imagen y procesando IA...";

    const formData = new FormData();
    formData.append('file', archivo);
    formData.append('language', 'spa');
    formData.append('isOverlayRequired', 'false');
    formData.append('apikey', 'K87210744088957');

    try {
        const response = await fetch('https://api.ocr.space/parse/image', {
            method: 'POST',
            body: formData
        });
        const data = await response.json();

        if (data.ParsedResults && data.ParsedResults.length > 0) {
            let textoCrudo = data.ParsedResults[0].ParsedText;
            estado.innerText = "¡Datos extraídos! Pulsa Guardar.";
            procesarTextoInteligente(textoCrudo);
        } else {
            estado.innerText = "No se ha podido leer texto.";
        }
    } catch (error) {
        estado.innerText = "Error de conexión al procesar.";
    } finally {
        e.target.value = "";
    }
}

function extraerSoloCodigoPostal(texto) {
    if (!texto) return "";
    let match5 = texto.match(/\b0\d{4}\b|\b[1-5]\d{4}\b/);
    if (match5) return match5[0];

    let match4 = texto.match(/\b\d{4}\b/);
    if (match4) return "0" + match4[0];
    return "";
}

function limpiarCalleParaMapa(calle) {
    if (!calle) return "";
    let limpia = calle;
    limpia = limpia.replace(/[\[\(]?\b(?:n[º°ª\.\*]\vert{}num\.?\vert{}núm\.?)\s*[\]\)]?\s*(\d+)/gi, ' $1');
    limpia = limpia.replace(/[\[\(]?\b(?:n[º°ª\.\*]\vert{}num\.?\vert{}núm\.?)\s*[\]\)]?/gi, ' ');     limpia = limpia.replace(/[\[\]]/g, ' ');
    limpia = limpia.replace(/\b(bis|piso|pta|puerta|esc|escalera|bajos|bjs|entlo|entresuelo|atico|ático|bloque|blq|loc|local)\b.*$/i, '');
    limpia = limpia.replace(/(\b\d+\s+)+\d+\s*[\-\/]\s*\d+.*$/g, '$1');
    limpia = limpia.replace(/\b\d+\s*[º°ª]\s*([a-zA-Z0-9]+\s*[ªº°]?)?$/g, '');
    return limpia.replace(/\s+/g, ' ').replace(/[,\-\.]+$/, '').trim();
}

function procesarTextoInteligente(texto) {
    inputTexto.value = texto.trim();
    let lineas = texto.split('\n').map(l => l.trim()).filter(l => l.length > 0);

    let nombre = "";
    let direccion = "";
    let codigoPostal = "";
    let telefono = "";

    let regexTel = /[6789]\d{8}/;
    let regexVia = /\b(C\/|C\.|CALLE|CARRER|AV|AVDA|AVENIDA|PLAZA|PLAÇA|PASEO|PASSEIG|PG|PASSATGE|PSJE|CAMI|CAMINO|CRTA|CARRETERA|RONDA|TRAVESSERA|BAJOS|PISO)\b/i;

    for (let linea of lineas) {
        let sinEspacios = linea.replace(/\s+/g, '');
        if (regexTel.test(sinEspacios)) {
            telefono = sinEspacios.match(regexTel)[0];
        }
        
        let lineaSinTel = linea.replace(regexTel, '');
        let cpDetectado = extraerSoloCodigoPostal(lineaSinTel);

        if (cpDetectado && !codigoPostal) {
            codigoPostal = cpDetectado;
        } else if (regexVia.test(linea) && !direccion) {
            direccion = limpiarCalleParaMapa(linea);
        } else if (linea.length > 4 && !linea.toUpperCase().includes("ALBAR") && !linea.toUpperCase().includes("TEL") && !linea.toUpperCase().includes("FACTURA")) {
            if (!nombre) nombre = linea;
            else if (!direccion) direccion = limpiarCalleParaMapa(linea);
        }
    }

    inputEditId.value = "";
    inputNombre.value = nombre;
    inputDireccion.value = direccion;
    inputPoblacion.value = codigoPostal;
    inputTelefono.value = telefono;
}

function obtenerDireccionParaMapa(c) {
    let cpLimpio = extraerSoloCodigoPostal(c.poblacion) || extraerSoloCodigoPostal(c.texto) || (c.poblacion || "").trim();
    let calleBase = (c.direccion || "").trim();

    if (!calleBase && c.texto) {
        let lineas = c.texto.split('\n').map(l => l.trim()).filter(l => l.length > 0);
        for (let l of lineas) {
            if (/\b(C\/|C\.|CALLE|CARRER|AV|AVDA|AVENIDA|PLAZA|PLAÇA|PASSEIG|CAMI|CRTA)\b/i.test(l)) {
                calleBase = l;
                break;
            }
        }
        if (!calleBase && lineas.length > 0) calleBase = lineas[0];
    }

    let calleLimpia = limpiarCalleParaMapa(calleBase);

    if (calleLimpia && cpLimpio) return `${calleLimpia}, ${cpLimpio}, España`;
    if (calleLimpia) return `${calleLimpia}, España`;
    if (cpLimpio) return `${cpLimpio}, España`;
    return "";
}

function distanciaKm(lat1, lon1, lat2, lon2) {
    const R = 6371;
    const dLat = (lat2 - lat1) * Math.PI / 180;
    const dLon = (lon2 - lon1) * Math.PI / 180;
    const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
              Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
              Math.sin(dLon/2) * Math.sin(dLon/2);
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

async function geocodificarDireccion(c) {
    let calle = limpiarCalleParaMapa(c.direccion || "");
    let cp = extraerSoloCodigoPostal(c.poblacion) || extraerSoloCodigoPostal(c.texto) || "";
    
    let calleSinTipo = calle.replace(/^(C\/|C\.|CALLE|CARRER\s+DE|CARRER|AV\.?|AVDA\.?|AVENIDA|PLAZA|PLAÇA|PG\.?|PASSEIG)\s+/i, '').trim();
    let soloNombreCalle = calleSinTipo.replace(/\b\d+.*$/, '').trim();

    let centroCp = null;
    let nombreMunicipioCp = "";

    if (cp) {
        try {
            let resCp = await fetch(`https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=es&postalcode=${encodeURIComponent(cp)}`);
            let datosCp = await resCp.json();
            if (datosCp && datosCp.length > 0) {
                centroCp = { lat: parseFloat(datosCp[0].lat), lon: parseFloat(datosCp[0].lon) };
                if (datosCp[0].display_name) {
                    nombreMunicipioCp = datosCp[0].display_name.split(',')[1] || "";
                }
            }
        } catch (e) {}
    }

    if (centroCp && calleSinTipo) {
        try {
            let urlPhoton = `https://photon.komoot.io/api/?q=${encodeURIComponent(calleSinTipo + " " + nombreMunicipioCp)}&lat=${centroCp.lat}&lon=${centroCp.lon}&limit=5`;
            let resP = await fetch(urlPhoton);
            let dataP = await resP.json();
            if (dataP && dataP.features) {
                for (let f of dataP.features) {
                    let lon = f.geometry.coordinates[0];
                    let lat = f.geometry.coordinates[1];
                    if (distanciaKm(centroCp.lat, centroCp.lon, lat, lon) <= 2.8) {
                        return { lat, lon };
                    }
                }
            }
        } catch (e) {}

        let delta = 0.025;
        let viewbox = `${centroCp.lon - delta},${centroCp.lat + delta},${centroCp.lon + delta},${centroCp.lat - delta}`;
        let consultas = [calleSinTipo, soloNombreCalle].filter(Boolean);

        for (let q of consultas) {
            try {
                let urlBox = `https://nominatim.openstreetmap.org/search?format=json&limit=5&countrycodes=es&viewbox=${viewbox}&bounded=1&q=${encodeURIComponent(q)}`;
                let resBox = await fetch(urlBox);
                let datosBox = await resBox.json();
                if (datosBox && datosBox.length > 0) {
                    for (let item of datosBox) {
                        let lat = parseFloat(item.lat);
                        let lon = parseFloat(item.lon);
                        if (distanciaKm(centroCp.lat, centroCp.lon, lat, lon) <= 2.8) {
                            return { lat, lon };
                        }
                    }
                }
            } catch (e) {}
        }

        return centroCp;
    }

    if (calleSinTipo) {
        try {
            let resL = await fetch(`https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=es&q=${encodeURIComponent(calleSinTipo + ", Barcelona, España")}`);
            let datosL = await resL.json();
            if (datosL && datosL.length > 0) {
                return { lat: parseFloat(datosL[0].lat), lon: parseFloat(datosL[0].lon) };
            }
        } catch (e) {}
    }
    return null;
}

async function colocarMarcadoresEnMapa() {
    if (!mapa || !capaMarcadores) return;
    capaMarcadores.clearLayers();

    if (clientes.length === 0) {
        ajustarVistaMapa();
        estadoMapa.innerText = coordsUsuario ? "🔵 Tu GPS está activo en el mapa." : "Esperando señal GPS...";
        return;
    }

    for (let i = 0; i < clientes.length; i++) {
        let c = clientes[i];
        c.direccion = limpiarCalleParaMapa(c.direccion || "");
        let dirMapa = obtenerDireccionParaMapa(c);

        if (!c.lat || !c.lon || c.dirCacheV3 !== dirMapa) {
            estadoMapa.innerText = `Situando parada ${i + 1} de ${clientes.length} (CP: ${c.poblacion || ''})...`;
            let coords = await geocodificarDireccion(c);
            if (coords) {
                c.lat = coords.lat;
                c.lon = coords.lon;
                c.dirCacheV3 = dirMapa;
                guardarEnAlmacenamiento();
            }
        }

        if (c.lat && c.lon) {
            let iconoNumero = L.divIcon({
                className: 'pin-numero',
                html: `${i + 1}`,
                iconSize: [28, 28],
                iconAnchor: [14, 14]
            });

            let urlNav = "https://www.google.com/maps/dir/?api=1&destination=" + encodeURIComponent(dirMapa);
            let popupHTML = `
                <div style="font-size:13px; line-height:1.4;">
                    <b>#${i + 1} - ${c.nombre || "Cliente"}</b><br>
                    📍 ${c.direccion || ""}<br>
                    📮 CP: ${c.poblacion || ""}<br>
                    📞 <a href="tel:${c.telefono || ''}">${c.telefono || "Sin teléfono"}</a><br>
                    <a href="${urlNav}" target="_blank" style="display:inline-block; margin-top:6px; background:#28a745; color:white; padding:6px 10px; border-radius:4px; text-decoration:none; font-weight:bold;">🚀 Navegar aquí en Google Maps</a>
                </div>
            `;

            L.marker([c.lat, c.lon], { icon: iconoNumero }).bindPopup(popupHTML).addTo(capaMarcadores);
        }
    }

    ajustarVistaMapa();
    estadoMapa.innerText = `✅ ${clientes.length} paradas en el mapa junto a tu posición.`;
}

function guardarCliente() {
    let id = inputEditId.value;
    let cpGuardado = extraerSoloCodigoPostal(inputPoblacion.value) || inputPoblacion.value.trim();
    let direccionSinSimboloNumero = limpiarCalleParaMapa(inputDireccion.value);

    let item = {
        id: id === "" ? Date.now() : Number(id),
        nombre: inputNombre.value.trim(),
        direccion: direccionSinSimboloNumero,
        poblacion: cpGuardado,
        telefono: inputTelefono.value.trim(),
        texto: inputTexto.value.trim()
    };

    if (!item.nombre && !item.direccion && !item.texto) {
        estado.innerText = "⚠️ Escanea un albarán o escribe algún dato primero.";
        return;
    }

    if (id === "") {
        clientes.push(item);
    } else {
        let i = clientes.findIndex(c => c.id === item.id);
        if (i !== -1) clientes[i] = item;
    }

    guardarEnAlmacenamiento();
    limpiarFormulario();
    cargarClientes();
    cambiarPestana(2);
}

function cargarClientes() {
    contenedorClientes.innerHTML = "";
    contadorParadas.innerText = clientes.length;

    if (clientes.length === 0) {
        cajaRutaCompleta.style.display = "none";
        contenedorClientes.innerHTML = "<p style='text-align:center; color:#777;'>No hay repartos guardados aún.</p>";
        return;
    }

    let paradasLimpias = [];

    clientes.forEach((c, idx) => {
        let calleLimpia = limpiarCalleParaMapa(c.direccion || "");
        c.direccion = calleLimpia;
        let dirMapa = obtenerDireccionParaMapa(c);
        if (dirMapa) paradasLimpias.push(dirMapa);
        
        let urlIndividual = "https://www.google.com/maps/dir/?api=1&destination=" + encodeURIComponent(dirMapa);

        let card = document.createElement('div');
        card.className = 'cliente-card';
        card.innerHTML = `
            <h4>Parada #${idx + 1} - 👤 ${c.nombre || "Albarán"}</h4>
            <p>📍 <b>Calle limpia:</b> ${calleLimpia}</p>
            <p>📮 <b>Código Postal:</b> ${c.poblacion}</p>
            <p>🗺️ <b>Búsqueda Maps:</b> ${dirMapa}</p>
            <p>📞 <b>Teléfono:</b> ${c.telefono}</p>
            <p style="background:#eee; padding:6px; border-radius:4px;">📄 <b>Texto extraído:</b>\n${c.texto}</p>
            <div class="card-acciones">
                <a class="btn-card btn-mapa" href="${urlIndividual}" target="_blank">🚀 Ir en Maps</a>
                <button class="btn-card btn-editar" type="button">✏️ Editar</button>
                <button class="btn-card btn-borrar" type="button">🗑️ Borrar</button>
            </div>
        `;
        card.querySelector('.btn-editar').addEventListener('click', () => editarCliente(c.id));
        card.querySelector('.btn-borrar').addEventListener('click', () => borrarCliente(c.id));
        contenedorClientes.appendChild(card);
    });

    if (paradasLimpias.length > 0) {
        botonesTramos.innerHTML = "";
        let tamanoTramo = 9;

        for (let i = 0; i < paradasLimpias.length; i += tamanoTramo) {
            let grupo = paradasLimpias.slice(i, i + tamanoTramo);
            let rutaSlashes = grupo.map(p => encodeURIComponent(p.replace(/\//g, ' '))).join('/');
            let urlTramo = "https://www.google.com/maps/dir//" + rutaSlashes;
            
            let inicioNum = i + 1;
            let finNum = i + grupo.length;
            let numTramo = Math.floor(i / tamanoTramo) + 1;

            let boton = document.createElement('a');
            boton.className = 'btn-ruta-completa';
            boton.href = urlTramo;
            boton.target = '_blank';
            
            if (paradasLimpias.length <= 9) {
                boton.innerText = `🚀 Abrir Ruta Completa en Google Maps (${paradasLimpias.length} paradas)`;
            } else {
                boton.innerText = `🚀 Tramo ${numTramo}: Paradas ${inicioNum} a ${finNum} en Google Maps`;
            }
            botonesTramos.appendChild(boton);
        }
        cajaRutaCompleta.style.display = "block";
    } else {
        cajaRutaCompleta.style.display = "none";
    }
}

function editarCliente(id) {
    let c = clientes.find(x => x.id === id);
    if (!c) return;
    inputEditId.value = c.id;
    inputNombre.value = c.nombre;
    inputDireccion.value = limpiarCalleParaMapa(c.direccion);
    inputPoblacion.value = c.poblacion;
    inputTelefono.value = c.telefono;
    inputTexto.value = c.texto;
    cambiarPestana(1);
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

function borrarCliente(id) {
    clientes = clientes.filter(x => x.id !== id);
    guardarEnAlmacenamiento();
    cargarClientes();
    colocarMarcadoresEnMapa();
}

function limpiarFormulario() {
    inputEditId.value = "";
    inputNombre.value = "";
    inputDireccion.value = "";
    inputPoblacion.value = "";
    inputTelefono.value = "";
    inputTexto.value = "";
    estado.innerText = "Listo para escanear o seleccionar...";
}

cargarDesdeAlmacenamiento();
cargarClientes();
solicitarGPSReal(false);
</script>
</body>
</html>
